<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Chez YaYa — gestion de restaurant</title>
<link rel="icon" href="data:,">
<style>
:root{--sh:clamp(236px,38.5vh,400px);--hh:92px;--bg:#f2efe9;--card:#fff;--ink:#1f2530;--mute:#6b7280;--line:#e7e2d9;--acc:#7a1f2e;--acc2:#a3293c;--ok:#2e7d57;--warn:#c27a10;--bad:#c0392b;--gold:#b58a2c;--hd:#231a1d;--sa:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#cfcac0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;box-shadow:0 0 30px rgba(0,0,0,.25)}
/* en-tête */
#hdr{background:var(--hd);color:#fff;padding:calc(5px + var(--st)) 10px 0;flex:none}
.r1{display:flex;align-items:center;gap:8px}
.tm{display:flex;flex-direction:column;line-height:1.05;min-width:76px}
.tm b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.tm small{font-size:11px;color:#c9bfc2}
.chip2{font-size:11px;padding:3px 8px;border-radius:99px;background:#444;white-space:nowrap}
.chip2.open{background:var(--ok)}.chip2.rush{background:var(--acc2)}.chip2.closed{background:#555}
.cash{margin-left:auto;text-align:right;line-height:1.05}
.cash small{display:block;font-size:10px;color:#c9bfc2;text-transform:uppercase;letter-spacing:.5px}
.cash b{font-size:19px;font-variant-numeric:tabular-nums}.cash b.neg{color:#ff8f82}
.ib{width:38px;height:38px;border-radius:12px;background:#3a2c30;font-size:18px;color:#fff}
.r2{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;margin:5px 0 5px}
.r2 button{height:34px;border-radius:10px;background:#3a2c30;color:#e8e0e2;font-weight:600;font-size:14px}
.r2 button.on{background:#fff;color:var(--hd)}
.pb{height:3px;background:#3a2c30;margin:0 -10px}.pb i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s linear}
/* contenu */
#main{flex:1 0 auto;padding:10px 10px 18px;overflow-anchor:none}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:15px}
h4.sec{margin:14px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
p{margin:6px 0;font-size:14px;line-height:1.4}
.muted{color:var(--mute);font-size:13px}.bad{color:var(--bad)}.warnt{color:var(--warn);font-size:12px}
small{font-size:12px;color:var(--mute)}
.hero{background:linear-gradient(135deg,#7a1f2e,#4d1420);color:#fff;border:0}
.status{font-weight:700;font-size:16px;margin-bottom:10px}
.dayline{position:relative;height:8px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.dayline .zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.18)}
.dayline i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);z-index:2;border-radius:9px}
.dl{display:flex;justify-content:space-between;font-size:10px;color:#e8c8cd;margin-top:4px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:76px}
.kpi span{font-size:12px;color:var(--mute)}.kpi b{font-size:19px;font-variant-numeric:tabular-nums}.kpi small{font-size:11px}
.kpi.pos b{color:var(--ok)}.kpi.neg b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.alerts,.log,.tips{list-style:none;margin:0;padding:0}
.alerts li{padding:8px 10px;border-radius:9px;margin-bottom:6px;font-size:13px;line-height:1.35}
.alerts li.bad{background:#fbe9e7;color:#8a2a1f}.alerts li.warn{background:#fff3df;color:#8a5a0a}
.log li{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35}.log li:last-child{border:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{border-radius:11px;padding:7px 4px;text-align:center;background:#eef3ee;border:1px solid #d7e2d7;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.tile b{font-size:21px;line-height:1.1}.tile span{font-size:12px;font-weight:700}.tile small{font-size:10px}
.tile.s-order{background:#fff3df;border-color:#f0d9a8}.tile.s-cook{background:#fde8e1;border-color:#f1c3b4}.tile.s-serve{background:#e3effa;border-color:#b9d3ee}
.tile.s-eat{background:#e6f3e8;border-color:#b9dcc0}.tile.s-bill{background:#f3ecfa;border-color:#d4c3ea}.tile.s-dirty{background:#ececec;border-color:#d4d4d4}
.qrow{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.pill{display:inline-flex;flex-direction:column;gap:2px;border:2px solid;border-radius:10px;padding:2px 7px;font-size:11px;font-weight:700;width:52px}
.pill .bar{height:4px}
.two{display:flex;justify-content:space-between;gap:10px;margin-top:8px}.two>div{flex:1}
.big{display:block;font-size:20px;margin:2px 0;font-variant-numeric:tabular-nums}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.gauge{text-align:center;display:flex;flex-direction:column;align-items:center}
.gauge svg{width:100%;max-width:80px}.gbg,.gfg{fill:none;stroke-width:9;stroke-linecap:round}.gbg{stroke:#ece7de}
.gauge b{font-size:14px;margin-top:-18px;font-variant-numeric:tabular-nums}.gauge span{font-size:10.5px;color:var(--mute);margin-top:3px}
.chart{width:100%;height:auto;display:block}.ct{font-size:9px;fill:#888}.cv{font-size:9.5px;fill:#333;font-weight:700}
.bar{height:7px;background:#ece7de;border-radius:9px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;border-radius:9px;transition:width .3s}
.stars{font-size:14px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold) var(--p),#d8d2c6 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
/* boutons */
.btn{min-height:44px;padding:10px 14px;border-radius:11px;font-weight:600;font-size:14px;background:#eee8dd;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;text-align:center}
.btn.primary{background:var(--acc);color:#fff}.btn.ghost{background:#eee8dd}.btn.danger{background:#f6dcd7;color:#8a2a1f}
.btn:disabled{opacity:.4}.btn:active:not(:disabled){transform:scale(.97);filter:brightness(.95)}
.btn.big{width:100%;min-height:54px;font-size:15px}.btn small{color:inherit;opacity:.75;font-weight:400}
.btnrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:90px;padding:8px 6px;font-size:13px}
.row{display:flex;align-items:center;gap:10px}.row.sub{margin-top:6px;align-items:flex-end}.grow{flex:1;min-width:0}
.grow>b{display:block;font-size:14.5px}.grow small{display:block;line-height:1.35}
.em{font-size:28px;width:38px;text-align:center;flex:none}
.item{padding:9px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item .btn{flex:none;min-width:84px}
.pr{text-align:right;flex:none}.pr b{font-size:15px;font-variant-numeric:tabular-nums}.pr small{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11.5px;padding:4px 9px;border-radius:99px;background:#f0ece3;color:#444;display:inline-flex;align-items:center;gap:4px}
.chip.ok{background:#e1f1e8;color:#1f6a46}.chip.warn{background:#fff0d6;color:#8a5a0a}.chip.bad{background:#fbe2de;color:#8a2a1f}
.chip .stars{font-size:12px}
.sw{min-width:92px;height:44px;border-radius:99px;background:#ddd7cb;color:#555;font-weight:700;font-size:13px;padding:0 12px}.sw.on{background:var(--ok);color:#fff}
.dish.on{border-color:#cfe3d6}.dish:not(.on){opacity:.75}
.row.price{margin:10px 0 0;justify-content:space-between}.pv{text-align:center}.pv b{font-size:22px;font-variant-numeric:tabular-nums}.pv small{display:block}
.rb{width:54px;height:48px;border-radius:12px;background:#eee8dd;font-size:26px;font-weight:700;line-height:1;color:var(--acc)}.rb:active{background:#e0d8c8}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.seg button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button span{font-size:22px}.seg button small{font-size:10.5px;color:var(--ink);line-height:1.1}.seg button.on{border-color:var(--acc);background:#f9ecee}
.ing{padding:10px 0;border-bottom:1px solid var(--line)}.ing:last-child{border:0}
.stp{display:flex;align-items:center;gap:6px}.stp b{min-width:34px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}.stp .rb{width:46px;height:44px;font-size:22px}
.sticky{margin:12px -10px -18px;padding:10px 10px 14px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sticky .btn{flex:none}
.stats{margin-top:6px}.stat{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:8px}.stat small{font-size:11.5px}.stat b{font-size:12px;text-align:right}
.stat.wide{grid-template-columns:140px 1fr 30px}
.repbig{display:flex;align-items:center;gap:16px}.huge{font-size:54px;line-height:1;color:var(--acc)}.repbig .stars{font-size:22px;display:block}
.hrow{display:grid;grid-template-columns:30px 1fr 28px;gap:8px;align-items:center}
.rev{border-left:4px solid var(--gold)}.rev.r1,.rev.r2{border-left-color:var(--bad)}.rev.r3{border-left-color:var(--warn)}.rev.r4,.rev.r5{border-left-color:var(--ok)}
.rtext{font-style:italic;margin:6px 0 0}
/* navigation */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);z-index:35;box-sizing:border-box;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sa);box-shadow:0 -3px 12px rgba(0,0,0,.12)}
:root{--navh:calc(58px + var(--sa))}
#app{padding-bottom:calc(var(--navh) + 8px)}
.mdjhd{display:flex;gap:12px;align-items:center;margin-bottom:8px}.mdjn{flex:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.mdjn b{font-size:26px}.mdjn span{font-size:11px;color:var(--mute)}.mdjn.warn{border-color:var(--warn)}.mdjn.bad{border-color:var(--bad)}.mdjhd small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
#nav button{position:relative;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8b8b8b;font-size:10.5px;font-weight:600;border-top:3px solid transparent}
#nav button span{font-size:21px;filter:grayscale(.8)}
#nav button.on{color:var(--acc);border-top-color:var(--acc)}#nav button.on span{filter:none}
/* toasts, modales */
#toasts{position:fixed;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 20px));top:calc(10px + var(--st));display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:#2b2226;color:#fff;padding:9px 12px;border-radius:11px;font-size:13px;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .25s ease-out;border-left:4px solid #888}
.toast.good{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(20,12,14,.62);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;animation:fin .2s}
.overlay.hidden{display:none}
@keyframes fin{from{opacity:0}}
.sheet{background:#fff;border-radius:18px;padding:18px 16px 16px;width:100%;max-height:92vh;max-height:92dvh;overflow-y:auto;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet .mi{font-size:46px;line-height:1}.sheet h2{margin:8px 0 6px;font-size:20px}
.mb{font-size:14.5px;line-height:1.5;text-align:left;margin-bottom:12px}.mb .muted{text-align:center}
.mc{display:flex;flex-direction:column;gap:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}.dots i{width:8px;height:8px;border-radius:9px;background:#ddd}.dots i.on{background:var(--acc);width:20px}
.sum{margin:8px 0;text-align:left}.srow{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow.pos b{color:var(--ok)}.srow.tot{font-size:17px;font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:4px 0}.srow.tot.neg b{color:var(--bad)}.srow.tot.pos b{color:var(--ok)}
.rv{text-align:left;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}.rv.ok{background:#e9f4ed}.rv.bad{background:#fbebe8}.rv small{display:block;color:inherit;opacity:.75}
.tips{text-align:left;font-size:13px;margin-top:8px}.tips li{padding:4px 0}
@media (max-width:360px){.kpi b{font-size:17px}.tm b{font-size:21px}.cash b{font-size:17px}.chip2{display:none}}
@media (min-width:521px){#app{margin-top:0}}

.card>.btn{display:flex;width:100%;margin-top:8px}.btnrow .btn,.item .btn{width:auto}

/* ---- v2 : scène, bandeau, formation ---- */
#scene{flex:none;height:var(--sh);background:#1d1517;position:relative;overflow:hidden;touch-action:pan-y}
#scene canvas{display:block;touch-action:pan-y}
#strip{flex:none;height:78px;background:#2b2226;color:#f4eee9;padding:6px 10px 6px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:5px;border-bottom:2px solid #3a2c30}
#strip.prm{background:#5a2330}
#pfloat{position:fixed;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 16px));bottom:calc(var(--navh) + 8px);z-index:40;height:78px;background:#5a2330;color:#f4eee9;padding:6px 10px;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
#pfloat[hidden]{display:none}
.st-t{font-size:12.5px;line-height:1.3;max-height:34px;overflow:hidden}
.st-t.prm{max-height:34px;font-size:12px;line-height:1.25}
.st-t.hint{color:#d9cfc8}.st-t i{color:#f0d9a8;font-style:normal}
.legend{display:flex;gap:10px;font-size:10.5px;color:#a89c97;white-space:nowrap;overflow:hidden}
.gbs{display:flex;gap:6px;flex:1;min-height:0}
.gb{flex:1;min-width:0;border-radius:9px;background:#4a3a3f;color:#fff;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px 3px;min-height:36px}
.gb small{font-size:10px;color:#e8d9d9;font-weight:500}
.gb.gold{background:#d99a1d;color:#2b1a03}.gb.gold small{color:#4a2e06}
.gb:disabled{opacity:.35}.gb:active:not(:disabled){filter:brightness(1.2)}
.cd{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffd23c;transform-origin:left;transform:scaleX(1)}
#nav button b{position:absolute;top:3px;left:calc(50% + 6px);background:#c0392b;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
.trg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tr{border:2px solid var(--line);border-radius:11px;background:#faf7f1;padding:6px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:58px;text-align:left}
.tr span{font-size:12.5px;font-weight:700}.tr .lvl{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--gold)}.tr small{font-size:11px;color:var(--acc);font-weight:600}
.tr:disabled{opacity:.5}.tr:active:not(:disabled){background:#f1e6d4}
.xpl{display:block;margin-top:2px}
.row.sk{margin-top:4px;padding:7px 0 2px;border-top:1px dashed var(--line);border-bottom:0}.em.sm{font-size:22px;width:30px}
.auto{margin-top:4px;gap:6px;flex-wrap:nowrap}.auto .sw{min-width:78px;height:36px;font-size:12px;padding:0 8px}
.btn.sm{min-height:36px;padding:4px 8px;font-size:12px;flex-direction:row}.rb.s{width:38px;height:36px;font-size:20px}
.rsv{padding:9px 12px}
@media (max-height:700px){#strip{height:70px}.legend{display:none}}


/* ---- v4 ---- */
#nav{grid-template-columns:repeat(8,1fr)}#nav button{font-size:9.5px}#nav button span{font-size:19px}
.ti{width:70px;height:44px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;background:#fff;color:var(--ink);padding:0 4px;min-width:0}
.ti:focus{border-color:var(--acc);outline:none;background:#fffaf0}.tiu{font-size:12px;color:var(--mute);margin-left:-2px}
.stp{flex-wrap:nowrap}.stp .ti{width:62px;height:44px}
.dayline .zone.meal{background:rgba(255,255,255,.34)}.dayline .zone.drk{background:rgba(120,190,255,.38)}
.dl2{position:relative;height:13px;font-size:10px;color:#e8c8cd;margin-top:3px}.dl2 span{position:absolute;transform:translateX(-50%);white-space:nowrap}.dl2 span:first-child{transform:none}.dl2 span:last-child{transform:translateX(-100%)}
.lg2{font-size:10px;color:#e8c8cd;margin-top:2px;display:flex;gap:10px}.lg2 i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:-1px}.lg2 .meal{background:rgba(255,255,255,.55)}.lg2 .drk{background:rgba(120,190,255,.7)}.lg2 .cl{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4)}
.seg.c3{grid-template-columns:repeat(3,1fr)}.seg.c5{grid-template-columns:repeat(5,1fr)}.seg button small{font-weight:600}
.seg.mini button{min-height:42px;flex-direction:row;justify-content:center;gap:5px;padding:4px}
.seg.mini button span{font-size:15px}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.chip.al{background:#f6ecff;color:#5a2d86}.chip.fl{background:#eef3ff;color:#27468f}
.row.auto{flex-wrap:wrap}.row.auto .sw{min-width:78px;height:40px}
.altw{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}.altab{border-collapse:collapse;font-size:11px;width:100%}.altab th{font-size:12px;padding:3px 0;font-weight:400;position:sticky;top:0}.altab td{text-align:center;padding:5px 1px;border-top:1px solid var(--line)}.altab td.dn{text-align:left;white-space:nowrap;padding-right:6px;font-size:11.5px;position:sticky;left:0;background:#fff}.altab td.y{background:#f3e8ff;color:#5a2d86;font-weight:800}
.mdjl{display:block;margin:8px 0 0}.mdjl>span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}.mdjl select,select.sel{width:100%;height:46px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:14.5px;padding:0 8px;color:var(--ink)}

.plan td.c{height:40px;border-radius:8px;text-align:center;font-weight:800;font-size:12px;background:#f0ece3;color:#999;padding:0}

/* 10 tables + un bar : rangées 0 et 1 (4 tables), rangée 2 = 2 tables à gauche + le bar à droite (colonnes 2-3), puis rangées supplémentaires */
function slotOf(i){ if(i<8) return {r:Math.floor(i/4),c:i%4}; if(i<10) return {r:2,c:i-8}; const j=i-10; return {r:3+Math.floor(j/4),c:j%4}; }
function rowsFor(n){ let r=3; for(let i=0;i<n;i++) r=Math.max(r,slotOf(i).r+1); return r; }

const BAR = {x0:140,x1:246};
function layout(){
  const key=S.tables+'|'+S.tabs.map(t=>t.cap).join('');
  if(R.lay&&R.layKey===key) return R.lay; R.layKey=key;
  const n=S.tables, cols=4, rows=rowsFor(n), cellW=(ROOMW-28)/cols, rowH=Math.min(76,236/rows), yTop=8+(236-rows*rowH)/2;
  const L={rows,cols,cellW,rowH,yTop,tb:[],vx:[],ly:[],plants:[],nodes:[],adj:[]};
  for(let c=0;c<=cols;c++) L.vx.push(c===0?7:c===cols?ROOMW-7:14+c*cellW);
  for(let k=0;k<=rows;k++) L.ly.push(yTop+k*rowH);
  L.ly.push(HALLY); L.hallK=rows+1; L.passK=Math.floor(rows/2);
  for(let i=0;i<n;i++){ const s=slotOf(i), r=s.r, c=s.c, cap=S.tabs[i].cap, d=tblDims(cap);
    L.tb.push({i,r,c,cx:14+cellW*(c+0.5),cy:yTop+rowH*(r+0.5),w:d.w,h:d.h,cap}); }
  const NK=rows+2; for(let k=0;k<NK;k++) for(let c=0;c<=cols;c++){ L.nodes.push({x:L.vx[c],y:L.ly[k],k,c}); L.adj.push([]); }
  const id=(k,c)=>k*(cols+1)+c, link=(a,b)=>{ const d=Math.hypot(L.nodes[a].x-L.nodes[b].x,L.nodes[a].y-L.nodes[b].y); L.adj[a].push([b,d]); L.adj[b].push([a,d]); };
  for(let k=0;k<NK;k++){ for(let c=0;c<cols;c++) link(id(k,c),id(k,c+1));
    if(k<NK-1) for(let c=0;c<=cols;c++){ let blocked=false;
      if(k<rows&&c>=1&&c<=cols-1){ const left=tabAt(k,c-1,n), right=tabAt(k,c,n); if(left>=0&&right>=0&&S.tabs[left]&&S.tabs[left].jr) blocked=true; }
      if(k===2&&L.vx[c]>BAR.x0&&L.vx[c]<BAR.x1) blocked=true;      // le comptoir du bar barre l'allée verticale

function lineAt(y){ const L=layout(); for(let k=0;k<L.ly.length;k++) if(Math.abs(L.ly[k]-y)<3) return k; return null; }
function nearestNode(x,y,kh){ const L=layout(); let b=0,bd=1e9; for(let i=0;i<L.nodes.length;i++){ const n=L.nodes[i]; if(kh!=null&&n.k!==kh) continue; const d=(n.x-x)**2+(n.y-y)**2; if(d<bd){bd=d;b=i;} } return b; }
function dijkstra(s,e){
  const L=layout(), N=L.nodes.length, dist=new Array(N).fill(1e9), prev=new Array(N).fill(-1), done=new Array(N).fill(false); dist[s]=0;
  for(let it=0;it<N;it++){ let u=-1,ud=1e9; for(let i=0;i<N;i++) if(!done[i]&&dist[i]<ud){ud=dist[i];u=i;} if(u<0||u===e) break; done[u]=true;
    for(const [v,d] of L.adj[u]) if(dist[u]+d<dist[v]){ dist[v]=dist[u]+d; prev[v]=u; } }

function roomRoute(x,y,ln0,bx,by,ln1){
  const L=layout(), out=[];
  if(ln0!=null){ y=L.ly[ln0]; out.push({x,y}); }
  let ey=by, tail=null; if(ln1!=null){ ey=L.ly[ln1]; tail={x:bx,y:by}; }
  const l0=ln0!=null?ln0:lineAt(y), l1=ln1!=null?ln1:lineAt(ey);
  if(l0!=null&&l0===l1){ out.push({x:bx,y:ey}); }
  else { const s=nearestNode(x,y,l0), e=nearestNode(bx,ey,l1); const p=dijkstra(s,e); for(const n of p) out.push({x:n.x,y:n.y}); out.push({x:bx,y:ey}); }

function kRoute(x,y,bx,by){ const o=[]; if(Math.abs(x-KCOR)>1) o.push({x:KCOR,y}); if(Math.abs(y-by)>1) o.push({x:KCOR,y:by}); o.push({x:bx,y:by}); return o; }

function estWait(size,self,regFirst){
  const now=S.t, n=S.tabs.length; const free=Array(n).fill(now);
  for(let i=0;i<n;i++){ const t=S.tabs[i]; if(t.g!=null){ const g=G(t.g); free[i]=now+(g?remainOf(g):5); }
    else if(t.hold!=null){ const r=S.res.find(x=>x.id===t.hold); if(r) free[i]=Math.max(now,r.t+(r.t-now<75?60:0)); } }
  const ahead=waitingQ().filter(g=>g!==self); const mine=regFirst?ahead.filter(g=>g.reg||g.critic||g.res):ahead; mine.sort(qSort);
  const n34=ahead.some(g=>laneOf(g.size)===1)||laneOf(size)===1;
  const place=(sz,res)=>{ let best=null;
    for(let r=0;r<rowsFor(n);r++){ const idx=[]; for(let j=0;j<n;j++) if(slotOf(j).r===r) idx.push(j);
      for(let a=0;a<idx.length;a++){ let cap=0,mx=now; for(let b=a;b<idx.length;b++){ const j=idx[b]; cap+=S.tabs[j].cap; mx=Math.max(mx,free[j]);
          if(cap>=sz){ if(!(sz<=2&&cap>=3&&n34&&!res)){ const sc=mx*100+cap; if(!best||sc<best.sc) best={sc,mx,a:idx[a],b:idx[b],idx}; } break; } } } }
    if(!best) return null; for(const j of best.idx.slice(best.idx.indexOf(best.a),best.idx.indexOf(best.b)+1)) free[j]=best.mx+38+4*sz; return best.mx-now; };

function replanOff(){
  const free=S.staff.filter(s=>needsOff(s)&&!s.offLock); free.forEach(s=>{ s.offStart=null; });
  const score=(s,start)=>{ let c=0; for(const w of [start,(start+1)%7]){ const wt=DOW_MULT[w];
      for(const svc of SVCS_OF(s.role)){ if(!worksSvc(s,svc)) continue;
        const others=S.staff.filter(o=>o!==s&&o.role===s.role&&worksSvc(o,svc)&&!absWeekday(o,w)).length;
        c+=wt*(others===0?60:6/others); }
      const offs=S.staff.filter(o=>o!==s&&o.role===s.role&&absWeekday(o,w)).length, offAll=S.staff.filter(o=>o!==s&&needsOff(o)&&absWeekday(o,w)).length; c+=wt*(9*offs+3*offAll); } return c+start*0.01; };
  for(let pass=0;pass<2;pass++) for(const s of free){ let bs=1e9,bw=0; for(let w=0;w<7;w++){ if(pass===1) s.offStart=null; const c=score(s,w); if(c<bs){ bs=c; bw=w; } } s.offStart=bw; }
  for(const s of S.staff) if(s.ct&&s.ct.k==='appr') s.school=((s.offStart==null?0:s.offStart)+3)%7;

function piIdx(){ let a=0,b=0; for(const id in DISH){ const d=DISH[id]; if(d.bar||!S.menu[id].on||dishLocked(id)) continue; a+=d.pop*S.menu[id].price/d.ref; b+=d.pop; } return b?a/b:1; }

function demandMult(){
  let f = 0.5+0.2*S.rep;
  f *= clamp(1+(1-piIdx())*1.2,0.3,1.5);
  f *= clamp(0.8+0.05*menuCount(),0.8,1.15);
  f *= 0.88+0.3*ambiance()/AMB_MAX;
  f *= DOW_MULT[(dayNum()-1)%7]*calDemand()*WX[weatherOf(dayNum()).k].m;
  f *= dayNum()===OPEN_DAY?0.8:dayNum()===OPEN_DAY+1?0.9:1;
  const m=minOfDay();
  for(const x of S.fx) if(x.m && (!x.from||m>=x.from)) f*=x.m;
  f*=womMult()*socMult()*origMult();
  return f;

function lambda(){
  const m=minOfDay(); if(!acceptsArrivals(m)) return 0;

function clusterA(i){ let a=i; while(a>0&&S.tabs[a-1].jr&&sameRow(a-1,a)) a--; return a; }
function clusterB(i){ let b=i; while(b<S.tabs.length-1&&S.tabs[b].jr&&sameRow(b,b+1)) b++; return b; }
function clusterOf(i){ const a=clusterA(i), b=clusterB(i); let cap=0,free=true,hold=null,occ=null;
  for(let j=a;j<=b;j++){ cap+=S.tabs[j].cap; if(S.tabs[j].g!=null){ free=false; occ=S.tabs[j].g; } if(S.tabs[j].hold!=null) hold=S.tabs[j].hold; }
  return {a,b,cap,free,hold,occ}; }
function clusterList(){ const out=[]; for(let i=0;i<S.tabs.length;){ const c=clusterOf(i); out.push(c); i=c.b+1; } return out; }
function maxPossibleCap(){ const n=S.tabs.length; const rows={}; for(let j=0;j<n;j++){ const r=slotOf(j).r; rows[r]=(rows[r]||0)+S.tabs[j].cap; } return Math.max(0,...Object.values(rows)); }
function totalSeats(){ return S.tabs.reduce((a,t)=>a+t.cap,0); }
function smallBlocked(g){ return g.size<=2&&!g.res&&!g.critic&&waitingQ().some(x=>x!==g&&laneOf(x.size)===1); }   // §6 : tables de 4 réservées aux 3-4 couverts tant que leur file n'est pas vide
function fitCluster(g){
  let best=null; const sb=smallBlocked(g);
  for(const c of clusterList()){ if(!c.free||c.cap<g.size) continue; if(c.hold!=null&&c.hold!==g.res) continue; if(sb&&c.cap>=3) continue;
    const score=(g.res&&c.hold===g.res?-100:0)+c.cap*10+c.a*0.1; if(!best||score<best.score) best={c,score}; }
  return best&&best.c;
}
// cherche une fenêtre de tables libres contiguës (même rangée) à assembler ; opts.contains = index qui doit en faire partie
function findWindow(size,resId,contains){
  let best=null; const n=S.tabs.length;
  for(let r=0;r<rowsFor(n);r++){ let lo=-1,hi=-1; for(let j=0;j<n;j++) if(slotOf(j).r===r){ if(lo<0) lo=j; hi=j; } if(lo<0) continue;
    for(let i=lo;i<=hi;i++){ let cap=0;
      for(let j=i;j<=hi;j++){ const t=S.tabs[j]; if(t.g!=null||(t.hold!=null&&t.hold!==resId)) break; cap+=t.cap;
        if(j>i&&cap>=size&&(contains==null||(contains>=i&&contains<=j))){ const sc=cap*10+(j-i); if(!best||sc<best.sc) best={a:i,b:j,cap,sc}; break; } } } }
  return best;
}
function joinWindow(w){ const done=[]; for(let j=w.a;j<w.b;j++){ if(!S.tabs[j].jr){ S.tabs[j].jr=true; done.push(j); } } R.lay=null; return done; }
function splitIdx(arr){ for(const j of arr||[]) if(S.tabs[j]) S.tabs[j].jr=false; R.lay=null; }
function autoAssembleOK(g){ return (g&&g.size>=5)||onDuty('waiter').some(s=>autOf(s)>=4); }

  const openTk=()=>S.tickets.filter(t=>!t.w&&!t.bar), openBar=()=>S.tickets.filter(t=>!t.w&&t.bar);

  const barRoom=(maxD)=>{ for(const s of bars){ if(busy.has(s.id)||openBar().length) continue; const e=R.ent[s.id]; let best=null,bs=1e9;
      for(const t of S.tasks){ if(t.w||t.forced||S.t<t.ready||t.type==='seat'||t.type==='clear') continue; const pos=taskPos(t); const dist=Math.hypot(e.x-pos.x,e.y-pos.y); if(dist>maxD) continue;
        const sc=taskPri(t)*0.4+dist/40; if(sc<bs){ bs=sc; best=t; } }

  barRoom(95);
  // serveurs

    for(const t of S.tasks){ if(t.w||t.forced||S.t<t.ready) continue; const pos=taskPos(t); const dist=Math.hypot(e.x-pos.x,e.y-pos.y);
      const sc=taskPri(t)*(0.25+0.15*aut)+dist/40*(1.3-0.2*aut); if(sc<bs){ bs=sc; best=t; } }

  // polyvalence : cuisinier/barman en salle, serveur/barman en cuisine

  for(const s of waiters){ if(busy.has(s.id)||!s.sk.poly) continue; if(S.tasks.some(x=>!x.w&&!x.forced&&S.t>=x.ready)) continue;

  // progression : marcher puis travailler

    if(!t.w) continue; const e=R.ent[t.w]; if(!e){ t.w=null; continue; }
    if(t.g!=null&&!G(t.g)&&!(t.type==='clear'&&t.si>=1)){ S.tasks=S.tasks.filter(x=>x!==t); continue; }

      let sp; if(tk.w==='P') sp=tk.bar?0.5:0.4; else { const s=S.staff.find(x=>x.id===tk.w);
        sp=tk.bar?spd(s)*(s.role==='bar'?1.15:(s.sk.poly?0.85:(inDr?0.75:0.5))):spd(s)*(s.role==='waiter'?0.8:s.role==='bar'?0.7:1); }

    const h=homeOf(s); e.home=h; entGo(e,h.x,h.y,h.ln); }

  for(const s of S.staff){ const b=busy.has(s.id);
    if(!avail(s)) s.fat=Math.max(0,s.fat-0.1*dt); else if(b) s.fat=Math.min(100,s.fat+0.09*dt); else s.fat=Math.max(0,s.fat-0.03*dt); }
}
function advanceTask(t){
  t.wk=0; const g=G(t.g), wid=t.w; const s=wid==='P'?null:S.staff.find(x=>x.id===wid);

  if(t.type==='order'){ fin(); if(g){ onOrder(g,wid); addXp(s,2); } return; }
  if(t.type==='serve'){ if(t.si===0){ t.si=1; return; } fin(); if(g){ serveDone(g,wid); addXp(s,2); } return; }

function reviewText(stars,g,parts){

}
function resEnd(g,state){ if(!g.res) return; const r=S.res.find(x=>x.id===g.res); if(!r) return; r.state=state; if(r.hold){ for(let j=r.hold[0];j<=r.hold[1];j++) if(S.tabs[j]&&S.tabs[j].hold===r.id) S.tabs[j].hold=null; r.hold=null; } if(r.autoJ){ splitIdx(r.autoJ); r.autoJ=null; } }
function pay(g,byPlayer,wid){
  const sub=g.items.reduce((a,i)=>a+i.price,0); const rev=sub*(1-g.disc); earn(rev);
  S.day.served++; S.day.people+=g.size; S.tot.served++;

  // habitués : mémoire de l'expérience

      r.loy=clamp(r.loy+(j.stars>=4?5:j.stars>=3?1:j.stars>=2?-8:-15),0,100);

      else if(j.stars>=4) note('⭐ '+r.name+' repart ravi(e) (fidélité '+Math.round(r.loy)+' %).','good'); } }
  else if(j.stars>=4.2&&g.size<=2&&S.regulars.length<10&&rnd()<0.12&&g.type!=='critic'&&g.type!=='tourist'){
    const used=S.regulars.map(r=>r.name); const nm=REG_NAMES.filter(n=>!used.includes(n));

    if(nm.length&&main){ S.regulars.push({id:nid(),name:pick(nm),fav:main.d,loy:35,visits:1,pref:minOfDay()<900?'midi':'soir',diet:g.diet||null,last:Math.round(j.stars)+'★',grudge:0}); note('⭐ '+S.regulars[S.regulars.length-1].name+' devient un(e) habitué(e) : plat préféré « '+DISH[main.d].n+' ».','good'); } }
  S.hyg=clamp(S.hyg-0.4,0,100);

  if(j.stars>=4.4&&rnd()<0.10) fanPost(g,j.stars);

/* ---------- Réservations ---------- */
function genResReqs(n){
  if(typeof closedNow==='function'&&closedNow()) return;
  const d0=Math.floor(S.t/1440)*1440, cap=maxPossibleCap(); let added=0;
  for(let k=0;k<n;k++){
    const slots=RES_SLOTS.filter(s=>d0+s>S.t+80); if(!slots.length) break;
    const slot=pick(slots), r=rnd(); const size=Math.min(cap,r<0.5?2:r<0.75?rint(3,4):rint(4,6));
    S.resReq.push({id:nid(),name:pick(RES_NAMES),size,t:d0+slot,exp:Math.min(d0+slot-25,S.t+160),diet:rnd()<0.12?(rnd()<0.6?'veg':'gf'):null}); added++; }
  if(added){ H.sound('ding'); note('📒 '+added+' nouvelle(s) demande(s) de réservation (onglet Résas).','info'); }
}
function A_resAccept(id){
  const q=S.resReq.find(x=>x.id===id); if(!q) return {ok:false,msg:'Demande expirée.'};
  if(q.size>maxPossibleCap()) return {ok:false,msg:'Impossible : pas assez de tables assemblables pour '+q.size+' personnes.'};
  const near=S.res.filter(r=>r.state==='booked'&&Math.abs(r.t-q.t)<=45).reduce((a,r)=>a+r.size,0);
  if(near+q.size>totalSeats()*0.8) return {ok:false,msg:'Salle déjà trop réservée à cette heure-là.'};
  S.resReq=S.resReq.filter(x=>x!==q);
  S.res.push({id:q.id,name:q.name,size:q.size,t:q.t,state:'booked',lateBy:rnd()<0.22?rint(5,20):0,nsh:rnd()<0.08,hold:null,diet:q.diet,autoJ:null});
  return {ok:true,msg:'Réservation acceptée : '+q.name+', '+q.size+' pers. à '+hhmm(q.t)+'. La table sera tenue 20 min avant.'};
}
function A_resDecline(id){ S.resReq=S.resReq.filter(x=>x.id!==id); return {ok:true,msg:'Demande déclinée.'}; }
function resTick(){
  S.resReq=S.resReq.filter(r=>S.t<r.exp);
  const svcStart=r=>{ const mm=((r.t%1440)+1440)%1440; return r.t-mm+(mm<1000?720:1140); };
  for(const r of S.res.slice().sort((a,b)=>(b.size-a.size)||(a.t-b.t))){
    if(r.state!=='booked') continue;
    if(S.t>=Math.min(r.t-20,svcStart(r))&&!r.hold){
      let c=null; for(const x of clusterList()){ if(!x.free||x.hold!=null||x.cap<r.size) continue; if(!c||x.cap<c.cap) c=x; }
      if(!c&&(r.size>=3||autoAssembleOK({size:r.size}))){ const w=findWindow(r.size,r.id,null); if(w){ r.autoJ=joinWindow(w); c=clusterOf(w.a); } }
      if(c){ for(let j=c.a;j<=c.b;j++) S.tabs[j].hold=r.id; r.hold=[c.a,c.b]; }
    }
    if(S.t>=r.t+r.lateBy){
      if(r.nsh){ if(S.t>=r.t+30){ r.state='noshow'; S.day.noshow++; resEnd({res:r.id},'noshow'); repUpdate(3,0.0); note('📅 No-show : '+r.name+' ('+r.size+' pers.) ne s’est pas présenté(e). Table libérée.','warn'); } }
      else { const g=newGroup({res:r.id,size:r.size,name:r.name,diet:r.diet,force:true}); if(g){ r.state='arrived'; r.gid=g.id; note('📅 '+r.name+' ('+r.size+' pers.) arrive'+(r.lateBy?' avec '+r.lateBy+' min de retard':'')+'.','info'); if(r.hold) seatGroup(g,{a:r.hold[0],b:r.hold[1]}); } else r.state='noshow'; }
    }

/* ---------- Commandes automatiques en cas de rupture ---------- */
const incoming = i=>S.orders.reduce((a,o)=>a+(o.items[i]||0),0);
function needOf(i){ let n=0; for(const id in DISH){ if(!S.menu[id].on||dishLocked(id)) continue; const q=DISH[id].rec[i]; if(q) n=Math.max(n,q); } return n; }

function cartCost(sid,cart){ let t=SUP[sid].fee; for(const i in cart) t+=cart[i]*supPrice(sid,i); return t; }
const needA=i=>Math.max(needOf(i),(typeof mdjOpen==='function'&&mdjOpen()&&S.mdj.on)?mdjIds().reduce((n,id)=>Math.max(n,DISH[id].rec[i]||0),0):0);
function autoCheck_v5(){
  const m=minOfDay(); if(S.awaitNext||m<DAYSTART) return; const carts={};
  for(const i in ING){ const a=S.auto[i]; if(!a||!a.on) continue; if(!needA(i)||S.stock[i].q>=needA(i)||incoming(i)>0) continue;
    const sid=autoSupplier(i,a); if(!sid) continue; (carts[sid]=carts[sid]||{})[i]=a.qty; }
  for(const sid in carts){
    for(const i in ING){ const a=S.auto[i]; if(!a.on||carts[sid][i]||!needA(i)||incoming(i)>0) continue; if(autoSupplier(i,a)===sid&&S.stock[i].q<a.qty*0.3) carts[sid][i]=a.qty; }
    let cart=carts[sid]; const names=()=>Object.keys(cart).map(i=>ING[i].n.toLowerCase()).join(', ');
    let tot=cartCost(sid,cart);
    if(tot>S.cash-40){ const budget=S.cash-40-SUP[sid].fee; const f=budget>0?budget/(tot-SUP[sid].fee):0; const c2={};
      for(const i in cart){ const q=Math.floor(cart[i]*f); if(q>=4) c2[i]=q; } cart=c2; tot=Object.keys(cart).length?cartCost(sid,cart):0; }
    if(!Object.keys(cart).length||tot>S.cash){ if(S.autoWarn[sid]!==dayNum()){ S.autoWarn[sid]=dayNum(); note('⚠️ Commande automatique impossible (trésorerie insuffisante) : '+Object.keys(carts[sid]).map(i=>ING[i].n.toLowerCase()).join(', ')+'.','bad'); } continue; }
    const r=placeOrder(sid,cart); if(r.ok) note('🤖 Rupture : commande automatique chez '+SUP[sid].n+' ('+names()+') — '+money(tot)+', livraison '+(SUP[sid].delay>=1440?'24 h':Math.round(SUP[sid].delay/60)+' h')+'.','info');
  }

function A_seat(gid,ti){
  const g=G(gid); if(!g||g.state!=='queue'||g.table!=null) return {ok:false,msg:'Ce groupe n’est plus en attente.'};
  if(drinksSelf()&&!g.res) return {ok:false,msg:'15h–18h : les clients s’installent seuls aux tables libres.'};
  let c=clusterOf(ti);
  const mine=g.rsv&&c.a<=g.rsv.b&&c.b>=g.rsv.a;
  if(!mine&&!c.free) return {ok:false,msg:'Table occupée.'};
  if(!mine&&c.hold!=null&&c.hold!==g.res){ const r=S.res.find(x=>x.id===c.hold); return {ok:false,msg:'Table réservée'+(r?' ('+r.name+', '+hhmm(r.t)+')':'')+'.'}; }
  if(!mine&&c.cap>=3&&smallBlocked(g)) return {ok:false,msg:'Les tables de 4 sont gardées pour les groupes de 3-4 couverts en attente.'};
  if(!mine&&c.cap<g.size){ const w=findWindow(g.size,g.res,ti); if(!w) return {ok:false,msg:'Table trop petite pour '+g.size+' personnes : assemblez des tables voisines.'}; if(g.rsv) releaseTable(g); g.autoJ=joinWindow(w); c=clusterOf(w.a); }
  if(g.rsv&&!mine) releaseTable(g);
  if(mine&&!c.free&&c.occ!==g.id) return {ok:false,msg:'Table occupée.'};
  seatGroup(g,c); return {ok:true,msg:'Groupe installé table '+(c.a+1)+(c.b>c.a?'-'+(c.b+1):'')+'.'};
}
function A_join(i){
  const n=S.tabs.length; if(i<0||i+1>=n||!sameRow(i,i+1)) return {ok:false,msg:'Pas de table voisine à assembler.'};
  if(S.tabs[i].jr) return {ok:false,msg:'Déjà assemblées.'};
  const a=clusterOf(i), b=clusterOf(i+1); if(!a.free||!b.free) return {ok:false,msg:'Les deux tables doivent être libres.'};

}

/* ---------- Boucle principale ---------- */
let lastMin=-1;
function step_v5(dt){
  S.t+=dt; const m=minOfDay();
  S.fx=S.fx.filter(f=>S.t<f.until);
  if(S.breakdown&&S.t>=S.breakdown.until){ note('🔧 '+S.breakdown.name+' est de nouveau opérationnel.','good'); S.breakdown=null; }
  for(const o of S.orders.slice()) if(S.t>=o.eta) deliver(o);
  if(acceptsArrivals(m)){ let p=lambda()*dt; while(p>0){ if(rnd()<Math.min(1,p)) newGroup(); p-=1; } }
  if(S.pendArr.length){ const due=S.pendArr.filter(a=>S.t>=a.t); if(due.length){ S.pendArr=S.pendArr.filter(a=>S.t<a.t); due.forEach(a=>newGroup({tourist:true,size:rint(3,4)})); } }
  if(S.regVisits.length){ const due=S.regVisits.filter(a=>S.t>=a.t); if(due.length){ S.regVisits=S.regVisits.filter(a=>S.t<a.t); due.forEach(a=>{ if(REG(a.rid)&&!S.groups.some(g=>g.reg===a.rid)) newGroup({reg:a.rid}); }); } }
  if(S.next&&S.t>=S.next.t){ const e=S.next; S.next=null; runEvent(e.id); }
  const mi=Math.floor(S.t);
  if(mi!==lastMin){ lastMin=mi; autoCheck(); resTick(); try{ v7EvtTick(); }catch(e){ console.error(e); } promptExpire(); tickTraining(); smTick(); comeBackTick();
    if(dayNum()>=OPEN_DAY&&m>=DAYSTART&&m<1170&&rnd()<0.012*(1+0.4*(S.rep-3))) genResReqs(1); }
  planSeating();
  assignAndProgress(dt);
  worldStep(dt);
  for(const g of S.groups.slice()){
    if(!S.groups.includes(g)) continue;
    const s=g.state;
    if(s==='queue'){ g.wait+=dt; if(g.res){ if(g.wait>g.pat*0.7) walkout(g,'queue'); } else if(g.wait>g.pat*0.675) autoMood(g); }
    else if(s==='walk'){ g.wait+=dt; if(g.arrived){ if(g.reg&&!g.regDone&&regWindow(g)) continue; g.state='order'; newTask('order',g,[['tbl',orderNeed(g)]],{ready:S.t+0.2}); } }
    else if(s==='order'||s==='cook'||s==='serve'||s==='decide'){ g.wait+=dt; if(g.wait>g.pat*1.7) walkout(g,'table'); }
    else if(s==='eat'){ if(S.t>=g.eatEnd){ g.state='bill'; newTask('bill',g,[['tbl',1.0]],{ready:S.t+billDelay()}); } }
    else if(s==='bill') g.wait+=dt*0.4;
  }
  if(m>=OPEN){ const pl=onDuty('dish').concat(tempDishOn()?[TEMP_DISH]:[]); let h=0; pl.forEach(s=>h+=0.012*(0.5+s.skill/10));
    if(S.equip.lave&&!(S.breakdown&&S.breakdown.type==='lave')) h+=0.008; S.hyg=clamp(S.hyg+h*dt,0,100); }
  if(m>=DAYEND) endDay();

function scheduleEvent(){
  S.next=null; const d=dayNum(); if(d<OPEN_DAY+3||rnd()>0.42) return;
  const pool=EVENTS.filter(e=>(!S.cooldown[e.id]||S.cooldown[e.id]<=d)&&(!e.ok||e.ok()));
  if(!pool.length) return;
  let tot=pool.reduce((a,e)=>a+e.w,0), r=rnd()*tot, ev=pool[0]; for(const e of pool){ r-=e.w; if(r<=0){ ev=e; break; } }
  const base=(d-1)*1440; let t;
  if(ev.at==='morning') t=base+DAYSTART+rint(5,60); else t=base+(rnd()<0.45?rint(735,840):rint(1170,1290));
  S.next={id:ev.id,t};
}

const AU = {ctx:null, mute:false, last:{}};
try{ const st=JSON.parse(localStorage.getItem(SET_KEY)||'{}'); AU.mute=!!st.mute; }catch(e){}
function audioUnlock(){
  try{
    if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C) AU.ctx=new C(); }
    if(AU.ctx&&AU.ctx.state!=='running') AU.ctx.resume();
  }catch(e){}
}
function tone(f,d,type,v,t0,slide){
  const c=AU.ctx; if(!c) return; const t=c.currentTime+(t0||0);
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||0.07,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.02);
}
function noise(d,v,t0,hp){
  const c=AU.ctx; if(!c) return; const t=c.currentTime+(t0||0); const n=Math.floor(c.sampleRate*d);
  const b=c.createBuffer(1,n,c.sampleRate), a=b.getChannelData(0); for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(); s.buffer=b; const g=c.createGain(); g.gain.value=v||0.05; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||3000;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
}

function hitTest(p){
  let best=null,bd=1e9;
  for(const h of SC.hits){ const d=Math.hypot(h.x-p.x,h.y-p.y); if(d<=h.r+3&&d-h.r*(h.k==='cash'?0.5:0)<bd){ bd=d; best=h; } }
  if(best&&best.k==='cash') return best;
  const L=layout(); const VB=L.tb.map((t,i)=>visGeom(i)||t); const cash=SC.hits.find(h=>h.k==='cash'&&Math.hypot(h.x-p.x,h.y-p.y)<=h.r+5); if(cash) return cash;
  if(best) return best;
  let ti=-1; for(const t of VB){ if(Math.abs(p.x-t.cx)<=t.w/2+8&&Math.abs(p.y-t.cy)<=t.h/2+17){ const d=Math.hypot(p.x-t.cx,p.y-t.cy); if(ti<0||d<Math.hypot(p.x-VB[ti].cx,p.y-VB[ti].cy)) ti=VB.indexOf(t); } }
  // tables assemblées : zone du pont
  if(ti<0){ for(let i=0;i<S.tables-1;i++) if(S.tabs[i].jr&&sameRow(i,i+1)){ const A=VB[i],B=VB[i+1]; if(p.x>A.cx&&p.x<B.cx&&Math.abs(p.y-A.cy)<A.h/2+10) { ti=i; break; } } }
  return ti>=0?{k:'tb',i:ti}:null;
}

  try{ SC.cv.setPointerCapture(ev.pointerId); }catch(e){} ui.touching=true; }

  h.forEach((x,i)=>{ const bx=(14-h.length+i)*bw+bw*0.18, w=bw*0.64, y0=y(0), y1=y(x.profit); const top=Math.min(y0,y1), ht=Math.max(1.5,Math.abs(y1-y0));

    const running=S.speed>0&&!ui.modal&&!S.awaitNext&&!S.over&&!(S.pw&&S.pw.j0)&&!ED.open&&!rcFrozen();

      acc+=dt*S.speed*BASE_RATE; let n=0;

    } else { acc=0; tvStep(dt*BASE_RATE); }

const DOWN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
function covGroups(){ return {
  resp:s=>s.post==='resp', serv:s=>s.role==='waiter', bar:s=>s.role==='bar', lead:s=>s.role==='cook'&&(s.post==='chef'||s.post==='second'),
  cook:s=>s.role==='cook', plong:s=>s.role==='dish', nett:s=>s.role==='clean' }; }
const GRP_MIN={resp:1,serv:2,bar:1,lead:1,cook:2,plong:1,nett:1};
const GRP_N={resp:'Responsable de salle',serv:'Serveurs',bar:'Barman',lead:'Chef / second',cook:'Cuisiniers',plong:'Plonge',nett:'Nettoyage'};
const GRP_DEP={resp:'sal',serv:'sal',bar:'sal',lead:'cui',cook:'cui',plong:'cui',nett:'net'};
const GRP_SVC=g=>g==='nett'||g==='resp'?['day']:['lunch','dinner'];
function offOn(s,w){ return s.ct&&(s.ct.k==='interim'||s.ct.k==='saison')?false:absWeekday(s,w); }
function shiftSvc(s,svc){ if(svc==='day') return true; return worksSvc(s,svc); }
function presentCount(grp,w,svc,list){ const f=covGroups()[grp]; let n=0; for(const s of (list||S.staff)){ if(!f(s)||s.tmp) continue; if(offOn(s,w)) continue; if(!shiftSvc(s,svc)) continue; n++; }
  for(const s of (list||S.staff)){ if(!s.cover) continue; for(const c of s.cover) if(c.g===grp&&c.w===w&&(c.svc===svc||svc==='day')&&!offOn(s,w)) n++; } return n; }
function covGaps(list){ const out=[]; if(!S.staff.length) return out; for(const g in GRP_MIN){ if(!(list||S.staff).some(covGroups()[g])) continue; for(let w=0;w<7;w++) for(const svc of GRP_SVC(g)){ if(presentCount(g,w,svc,list)<GRP_MIN[g]) out.push({g,w,svc}); } } return out; }
function covProposals(){ // propositions de correction pour chaque trou, polyvalence d'abord ; sinon déplacement de repos ; sinon intérim
  const gaps=covGaps(), P=[];
  const key=x=>x.g+'|'+x.w+'|'+x.svc;
  for(const gp of gaps){
    // 1) polyvalence : un collègue polyvalent, présent ce jour-là, couvre
    const dep=GRP_DEP[gp.g]; const cand=S.staff.filter(s=>s.sk&&s.sk.poly&&!s.tmp&&!offOn(s,gp.w)&&!covGroups()[gp.g](s)&&(gp.svc==='day'||shiftSvc(s,gp.svc))&&!(s.cover||[]).some(c=>c.w===gp.w&&c.svc===gp.svc)&&(dep!=='net'||true));
    cand.sort((a,b)=>(POSTS[a.post]&&POSTS[a.post].dep===dep?-1:0)-(POSTS[b.post]&&POSTS[b.post].dep===dep?-1:0)||b.skill-a.skill);
    if(cand.length){ P.push({type:'poly',gap:gp,sid:cand[0].id,text:'🔀 '+cand[0].name+' (polyvalent·e) couvre « '+GRP_N[gp.g]+' » le '+DOWN[gp.w].toLowerCase()+(gp.svc==='day'?'':' ('+SVC[gp.svc].n.toLowerCase()+')')}); continue; }
    // 2) déplacer les repos d'un membre du groupe
    let best=null; const members=S.staff.filter(s=>covGroups()[gp.g](s)&&!s.tmp&&needsOff(s));
    const base=covGaps().length;
    for(const m of members) for(let w=0;w<7;w++){ if(w===m.offStart) continue; const old=m.offStart; m.offStart=w; const n=covGaps().length; m.offStart=old; if(n<base&&(!best||n<best.n||(n===best.n&&Math.abs(w-old)<Math.abs(best.w-best.old)))) best={m,w,n,old}; }
    if(best){ P.push({type:'move',gap:gp,sid:best.m.id,w:best.w,text:'📅 Déplacer le repos de '+best.m.name+' ('+offLab(best.old)+' → '+offLab(best.w)+')'}); continue; }
    P.push({type:'interim',gap:gp,text:'👷 Aucune solution : un intérimaire sera appelé le '+DOWN[gp.w].toLowerCase()+' pour « '+GRP_N[gp.g]+' »'+(gp.svc==='day'?'':' ('+SVC[gp.svc].n.toLowerCase()+')')+' (dernier recours, automatique)'});
  }
  return P;
}
function covApply(p){ const s=S.staff.find(x=>x.id===p.sid); if(!s) return;

  const h=[...id].reduce((a,x)=>a*31+x.charCodeAt(0),7)%100/100;
  const base=0.42*d.q+0.58*(1+(0.7*c+0.3*s2)/10*4); const hard=0.07*Math.max(0,d.prep-3.5)*Math.max(0,8-c)/4;

/* =====================================================================
   V6b · ENTRETIENS DANS LE RESTAURANT (lundi + mardi, 9h–13h / 14h–18h)
   Les candidats arrivent, patientent aux tables, s'impatientent et partent ;
   le patron les reçoit à sa table d'entretien ; récapitulatif d'équipe en 1 clic.
   ===================================================================== */
const RC_LUNCH0=780, RC_LUNCH1=840, RC_END=1080;
const RCR={ents:{},out:[],pend:null,arrN:0};
const rcOn=()=>!!(S&&S.pw&&!S.pw.j0&&S.pw.rc&&S.pw.cands&&S.pw.cands.length&&dayNum()<=2);
const rcLive=()=>rcOn()&&!S.pw.rc.end[dayNum()];
const rcFrozen=()=>!!(S&&S.pw&&S.pw.rc&&S.pw.rc.cur!=null&&PN.name==='iv');
const rcLunchNow=()=>{ const m=minOfDay(); return m>=RC_LUNCH0&&m<RC_LUNCH1; };
const waitBonus=c=>Math.min(3,(c.wt||0)/40+(c.ret?0.5:0));
const shuf=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
/* ---------- génération des candidats du lundi ---------- */
const MON_COUNTS={chef:2,second:2,commis:2,appr:2,aide:2,plong:3,resp:2,serv:4,csalle:2,barman:3,nett:3};
const SLOT_POST={resp:['resp'],serv:['serv','serv','csalle'],bar:['barman'],chef:['chef'],second:['second'],commis:['commis','commis','aide'],appr:['appr'],plong:['plong'],nett:['nett']};
const noLunch=t=>t>=RC_LUNCH0&&t<RC_LUNCH1?Math.round(RC_LUNCH1+(t-RC_LUNCH0)/4):t;
function rcSchedule(list,t0,t1){ const n=list.length; list.forEach((c,i)=>{ const base=t0+(t1-t0)*(n>1?i/(n-1):0); c.arr=noLunch(Math.round(clamp(base+(i?rnd()*8-4:0),t0,t1))); c.loc='out'; c.pt=0; });
  list.sort((a,b)=>a.arr-b.arr); }
function candInit(){
  const pw=S.pw, list=[]; let id=1000;
  for(const p in MON_COUNTS) for(let k=0;k<MON_COUNTS[p];k++){ const c=candGen(p,id++); c.day=1; list.push(c); }
  shuf(list); rcSchedule(list,540,1000);
  pw.cands=list; pw.picked=[]; pw.iv={1:0,2:0}; pw.rc={tab:null,end:{},lunch:{},back:{},cur:null,quit:0,seen:0};
}
/* ---------- places ---------- */
function rcSeatList(){ const out=[]; const L=layout(); const tab=S.pw.rc.tab; L.tb.forEach((T,i)=>{ if(i===tab) return; const g=tgtGeom(i); if(!g) return; seatsOf(g).forEach((s,k)=>out.push({key:i+':'+k,x:s.x,y:s.y,i})); }); return out; }
function rcPickSeat(c){
  const used=new Set(S.pw.cands.filter(x=>x!==c&&x.loc==='in'&&x.seat).map(x=>x.seat));
  const seats=rcSeatList().filter(s=>!used.has(s.key));
  if(seats.length){ const occ={}; for(const k of used){ const i=String(k).split(':')[0]; occ[i]=(occ[i]||0)+1; }
    const mn=Math.min(...seats.map(s=>occ[s.i]||0)); const pool=seats.filter(s=>(occ[s.i]||0)===mn); const s=pool[Math.floor(rnd()*pool.length)]; return {key:s.key,x:s.x,y:s.y,seated:true}; }
  let k=0; while(used.has('s'+k)) k++; const p=laneCellPos(k%3,1+Math.floor(k/3)); return {key:'s'+k,x:p.x,y:p.y,seated:false};
}
function rcIvSeats(){ const rc=S.pw.rc; const g=rc.tab!=null?tgtGeom(rc.tab):null; if(!g) return null; const ts=seatsOf(g); return {c:ts[0],p:ts[1]||ts[0]}; }
function rcEnt(c,create){ let e=RCR.ents[c.id]; if(!e&&create){ e=mkEnt({cid:c.id,sp:112,sk:c.id%8,col:SHIRTS[c.id%SHIRTS.length],hair:HAIRS[c.id%6]}); RCR.ents[c.id]=e; } return e; }
function rcSettle(){ // horloge à l'arrêt : les déplacements se terminent immédiatement
  if(S.speed>0&&!rcFrozen()&&!ui.modal) return;
  for(const id in RCR.ents){ const e=RCR.ents[id]; if(e.goal&&e.path.length) entPlace(e,e.goal.x,e.goal.y); }
  RCR.out.length=0; const P=R.ent.P; if(P&&P.goal&&P.path.length) entPlace(P,P.goal.x,P.goal.y);
}
function rcExit(c,angry){ const e=RCR.ents[c.id]; if(!e) return; delete RCR.ents[c.id]; e.angry=!!angry; e.sp=125; e.seatPos=null; const d=doorSlot(0); entGo(e,d.x,d.y); RCR.out.push(e); }
function rcSpawn(c){ const e=rcEnt(c,true); const d=doorSlot(RCR.arrN++%4); entPlace(e,d.x,d.y); const s=rcPickSeat(c); c.seat=s.key; e.seatPos=s; entGo(e,s.x,s.y); return e; }
/* ---------- boucle ---------- */
function rcAdvance(dt){
  if(!rcLive()) return; const pw=S.pw, rc=pw.rc; if(rc.tab==null) return; const d=dayNum(), m=minOfDay();
  if(m>=RC_LUNCH0&&m<RC_LUNCH1&&!rc.lunch[d]){ rc.lunch[d]=true; let n=0; for(const c of pw.cands) if(c.loc==='in'&&c.day===d){ c.loc='lunch'; rcExit(c,false); n++; }
    if(n) toast('🍽️ Pause déjeuner (13h–14h) : les candidats sortent déjeuner et reviendront à 14h.','info'); }
  if(m>=RC_LUNCH1&&!rc.back[d]){ rc.back[d]=true; rc.lunch[d]=true; let n=0; for(const c of pw.cands) if(c.loc==='lunch'&&c.day===d){ c.loc='in'; rcSpawn(c); n++; }
    if(n) toast('🕑 14h : '+n+' candidat'+(n>1?'s sont revenus':' est revenu')+' dans la salle.','info'); }
  const lunch=m>=RC_LUNCH0&&m<RC_LUNCH1;
  if(!lunch){
    for(const c of pw.cands){ if(c.loc!=='in'||c.day!==d) continue; c.wt=(c.wt||0)+dt; c.pt=(c.pt||0)+dt; if(c.pt>=c.lim) rcQuit(c); }
    let sp=0; for(const c of pw.cands){ if(sp>=2) break; if(c.loc==='out'&&c.day===d&&c.arr<=m){ c.loc='in'; rcSpawn(c); sp++; if(!rc.seen){ rc.seen=1; toast('🧑‍💼 Les premiers candidats arrivent : touchez-en un pour le recevoir.','info'); } } }
  }
  if(m>=RC_END&&rc.cur==null) rcEndDay(d);
}
function rcQuit(c){ const e=RCR.ents[c.id]; c.loc='gone'; c.st='out'; c.left='attente'; c.last='Parti(e) : attente trop longue.'; S.pw.rc.quit++;
  const pi=S.pw.picked.indexOf(c.id); if(pi>=0) S.pw.picked.splice(pi,1);
  if(e){ vfx('💢 Trop long !',e.x,e.y-12,'#b3261e',3); }
  rcExit(c,true); toast('😤 '+c.name+' ('+POSTS[c.post].n+') est reparti(e) : trop d’attente.','bad'); try{ logMsg('😤 '+c.name+' ('+POSTS[c.post].n+') est parti(e) sans entretien (attente trop longue).'); }catch(e2){} }
function rcMove(dt){ for(const id in RCR.ents) entStep(RCR.ents[id],dt); for(const e of RCR.out) entStep(e,dt); RCR.out=RCR.out.filter(e=>e.path.length>0); rcPendCheck(dt); }
function worldStep(dt){ worldStep_v5(dt); if(!S||!S.pw||!S.pw.rc) return; try{ rcAdvance(dt); rcMove(dt); }catch(e){ console.error(e); } }
function rcCost(n){ if(!rcOn()||S.pw.rc.cur==null) return; S.t+=n; rcAdvance(n); }
/* ---------- recevoir un candidat ---------- */
function rcWhyNot(c){ const rc=S.pw.rc, m=minOfDay();
  if(!rcLive()) return 'Les entretiens ne sont pas ouverts.'; if(rc.tab==null) return 'Choisissez d’abord votre table d’entretien.';
  if(rc.cur!=null) return 'Un entretien est déjà en cours.'; if(m>=RC_END) return 'Les entretiens sont terminés pour aujourd’hui.';
  if(m>=RC_LUNCH0&&m<RC_LUNCH1) return 'Pause déjeuner : reprise à 14h.'; if(!c||c.loc!=='in') return 'Ce candidat n’est pas dans la salle.'; return ''; }
const rcCanReceive=c=>!rcWhyNot(c);
function rcReceive(id){ const c=candById(id); if(!c) return false; if(c.loc==='iv'&&!PN.name){ ivOpen(c.id); return true; } const why=rcWhyNot(c); if(why){ toast(why,'bad'); return false; }
  const rc=S.pw.rc, t=rcIvSeats(); if(!t){ toast('Table d’entretien introuvable : choisissez-en une autre.','bad'); rc.tab=null; return false; }
  rc.cur=c.id; c.loc='iv'; c.seat='iv'; c.rcv=dayNum(); const e=rcEnt(c,true)||rcEnt(c,true); e.seatPos={seated:true}; const P=R.ent.P;
  entGo(e,t.c.x,t.c.y); if(P) entGo(P,t.p.x,t.p.y); RCR.pend={id:c.id,t:0,cs:t.c,ps:t.p}; R.sel=null;
  if(S.speed===0||ui.modal){ entPlace(e,t.c.x,t.c.y); if(P) entPlace(P,t.p.x,t.p.y); RCR.pend=null; ivOpen(c.id); }
  snd('click'); return true; }
function rcPendCheck(dt){ const p=RCR.pend; if(!p) return; const c=candById(p.id); if(!c||c.loc!=='iv'){ RCR.pend=null; return; } p.t+=dt;
  const e=RCR.ents[c.id], P=R.ent.P; const near=(a,t)=>!a||(Math.hypot(a.x-t.x,a.y-t.y)<3.5&&!a.path.length);
  if((near(e,p.cs)&&near(P,p.ps))||p.t>14){ RCR.pend=null; if(e) entPlace(e,p.cs.x,p.cs.y); if(P) entPlace(P,p.ps.x,p.ps.y); ivOpen(c.id); } }
function rcIvClosed(id){ const rc=S.pw.rc; RCR.pend=null; if(rc.cur==null) return; rc.cur=null; const c=candById(id); const P=R.ent.P;
  if(P){ const h=patronSpot(); P.home=h; entGo(P,h.x,h.y); }
  if(!c) return; const e=RCR.ents[c.id];
  if(c.st==='acc'||c.st==='out'){ c.loc='done'; if(e&&c.st==='acc') vfx('✔ À bientôt !',e.x,e.y-12,'#1f6b46',2.6); rcExit(c,false); }
  else if(rcLunchNow()){ c.loc='lunch'; rcExit(c,false); }
  else { c.loc='in'; const s=rcPickSeat(c); c.seat=s.key; if(e){ e.seatPos=s; entGo(e,s.x,s.y); } else rcSpawn(c); }
  rcSettle(); save(); }
function rcAutoPick(c){ const pw=S.pw; if(pw.teamOK||pw.picked.includes(c.id)) return; const sl=POSTS[c.deal.post].slot, k=pickCount();
  if((k[sl]||0)<SLOTS[sl].q){ pw.picked.push(c.id); toast('✔ '+c.name+' retenu(e) : '+POSTS[c.deal.post].n+'.','good'); }
  else toast('Poste « '+SLOTS[sl].n+' » complet : '+c.name+' est mis(e) en réserve (voir le récapitulatif).','info'); }
/* ---------- fin de journée ---------- */
function rcPrepTuesday(){ const pw=S.pw, rc=pw.rc; const ps=pickState(); const vac=[]; for(const sl in SLOTS) if((ps.k[sl]||0)<SLOTS[sl].q) vac.push(sl);
  const back=shuf(pw.cands.filter(c=>c.ret&&c.loc==='out'&&c.day===2)); back.forEach((c,i)=>{ c.arr=noLunch(540+Math.round(i*7+rnd()*3)); });
  let id=Math.max(...pw.cands.map(c=>c.id))+1; const nw=[];
  for(const sl of vac) for(let k=0;k<2;k++){ const opts=SLOT_POST[sl]; const c=candGen(opts[(k+Math.floor(rnd()*3))%opts.length],id++); c.day=2; c.isNew=1; nw.push(c); }
  shuf(nw); rcSchedule(nw,Math.min(900,540+back.length*7+25),1010); pw.cands.push(...nw); rc.tue={back:back.length,nw:nw.length,vac:vac.length,vacL:vac}; return rc.tue; }
function rcEndDay(d,silent){
  const pw=S.pw, rc=pw.rc; if(rc.end[d]) return; rc.end[d]=true; rc.lunch[d]=true; rc.back[d]=true; RCR.pend=null; rc.cur=null;
  let back=0, lost=0, seen=0, hired=0;
  for(const c of pw.cands){ if(c.rcv===d) seen++; if(c.day!==d) continue; if(c.loc==='done'||c.loc==='gone') { continue; }
    const unrec=(c.st==='new'||c.st==='int'||c.st==='neg');
    if(c.st==='acc'||c.st==='out') c.loc='done';
    else if(unrec&&d===1){ c.loc='out'; c.day=2; c.ret=1; c.pt=0; back++; }
    else { c.loc='gone'; c.left='fin'; lost++; }
    if(RCR.ents[c.id]) rcExit(c,false); }
  for(const id in RCR.ents){ const c=candById(id); if(c) rcExit(c,false); }
  let tue=null; if(d===1) tue=rcPrepTuesday();
  hired=pw.picked.length; S.speed=0; rcSettle(); hdrCache=''; save(); if(silent) return;
  if(d===1) showPopup({icon:'🌆',title:'18h · fin de la journée d’entretiens',body:'<b>'+seen+'</b> candidat'+(seen>1?'s reçus':' reçu')+' · <b>'+hired+'</b> retenu'+(hired>1?'s':'')+' · <b>'+pw.rc.quit+'</b> parti'+(pw.rc.quit>1?'s':'')+' faute d’attente.<br><br>🗓️ <b>Demain 9h</b> : les <b>'+tue.back+'</b> candidat'+(tue.back>1?'s':'')+' non reçu'+(tue.back>1?'s':'')+' reviennent, puis <b>'+tue.nw+'</b> nouveaux candidats (2 par poste encore vide : '+tue.vac+' poste'+(tue.vac>1?'s':'')+').',choices:[{label:'Passer à mardi ▶',cb(){ if(phaseV6()==='prep'&&progDone(1)) prepAdvance(); }},{label:'Rester à lundi',cls:'ghost',cb(){} }]});
  else showPopup({icon:'🌆',title:'18h · fin des entretiens',body:'<b>'+seen+'</b> candidat'+(seen>1?'s reçus':' reçu')+' aujourd’hui · <b>'+hired+'</b> / 16 recrues retenues.<br><br>Il est temps de valider l’équipe : le <b>récapitulatif</b> (poste, salaire, jours de repos) se confirme en <b>un clic</b>. Les postes restés vides seront pourvus par de l’intérim (dernier recours).',choices:[{label:'Ouvrir le récapitulatif ▶',cb(){ panelOpen('team'); }},{label:'Plus tard',cls:'ghost',cb(){} }]});
}
function rcForceEnd(){ const d=dayNum(), rc=S.pw.rc; if(rc.end[d]) return; if(rc.cur!=null){ toast('Terminez d’abord l’entretien en cours.','bad'); return; } const base=(d-1)*1440; if(S.t<base+RC_END) S.t=base+RC_END; rcEndDay(d); }
/* ---------- placement après chargement ---------- */
function placeAll(){ placeAll_v5(); try{ rcPlace(); }catch(e){ console.error(e); } }
function rcPlace(){ RCR.ents={}; RCR.out=[]; RCR.pend=null; if(!S||!S.pw||!S.pw.rc) return; const rc=S.pw.rc; rc.cur=null; if(!rcLive()) return; if(rc.tab!=null&&!tgtGeom(rc.tab)) rc.tab=null;

function rcChip(){ if(!rcLive()) return 'Préparatifs'; const rc=S.pw.rc; if(rc.tab==null) return '🪑 Choisir la table'; return rcLunchNow()?'🍽️ Pause 13h–14h':minOfDay()>=RC_END?'Entretiens finis':'🎤 Entretiens'; }
function rcSummary(d){ const pw=S.pw, rc=pw.rc; const mine=pw.cands.filter(c=>c.day===d||c.rcv===d); const inn=mine.filter(c=>c.loc==='in'||c.loc==='iv').length, soon=mine.filter(c=>c.loc==='out'&&c.day===d).length, lunch=mine.filter(c=>c.loc==='lunch').length;

  return seen+' reçu(s) · '+inn+' en salle'+(lunch?' · '+lunch+' en pause':'')+' · '+soon+' attendu(s)'+(rc.quit?' · '+rc.quit+' parti(s)':''); }
/* ---------- enveloppes : vitesse, scène, taps, bandeau ---------- */
function setSpeed(n){ if(n>0&&rcLive()&&S.pw.rc.tab==null){ toast('👆 Choisissez d’abord votre table d’entretien : touchez-la sur le plan.','bad'); return; } setSpeed_v5(n); }

function leaveToggle(sid,d){
  const s=S.staff.find(x=>x.id===sid); if(!s||!hasLeave(s)) return {ok:false,msg:'Cet employé n’a pas de congés à poser.'};

function closeToggle(d){

function v7MonthAcc(d){ const pw=S.pw; pw.mon=pw.mon||{}; const mk=monthKey(d); const m=pw.mon[mk]=pw.mon[mk]||{};
  for(const id in S.day.sales){ if(!sellable(id)) continue; m[id]=(m[id]||0)+S.day.sales[id]; }
  if(d>=OPEN_DAY&&lastDayOfMonth(d)) pw.repDue={mk,day:d}; }
const monSales=mk=>((S.pw.mon||{})[mk])||{};
function favCompute(sales){ const f={}; for(const c of FAV_CATS) f[c]=Object.keys(sales).filter(i=>favOK(i)&&DISH[i].cat===c&&sales[i]>0).sort((a,b)=>sales[b]-sales[a]).slice(0,FAV_N); return f; }
/* favoris verrouillés : ceux du dernier rapport ; avant le premier rapport, ceux du mois en cours (provisoires) */

const favNow=()=>S.pw.fav||favCompute(monSales(monthKey(dayNum())));
const favSet=()=>{ const f=favNow(), o={}; for(const c in f) for(const i of f[c]) o[i]=1; return o; };
const isFav=i=>!!favSet()[i];
function monthStats(mk){ const H=S.hist.filter(h=>monthKey(h.day)===mk); return {n:H.length,rev:H.reduce((a,h)=>a+h.rev,0),profit:H.reduce((a,h)=>a+h.profit,0)}; }
function buildReport(mk,day){ const sales=monSales(mk); const all=Object.keys(sales).filter(i=>sellable(i)&&sales[i]>0).sort((a,b)=>sales[b]-sales[a]);
  const top=all.slice(0,10).map(i=>[i,sales[i]]);
  const flops=Object.keys(DISH).filter(i=>onCarte(i)).sort((a,b)=>(sales[a]||0)-(sales[b]||0)||DISH[a].n.localeCompare(DISH[b].n)).slice(0,5).map(i=>[i,sales[i]||0]);
  const st=monthStats(mk); return {mk,day,top,flop:flops,fav:favCompute(sales),tot:Object.values(sales).reduce((a,b)=>a+b,0),rev:Math.round(st.rev),profit:Math.round(st.profit),nd:st.n}; }
function v7MonthReport(){ const pw=S.pw, due=pw.repDue; if(!due) return; pw.repDue=null; pw.repH=pw.repH||[];

const rankRow=(i,n,k,fav)=>'<div class="row" style="display:flex;gap:6px;padding:4px 0;border-top:1px solid var(--line)"><b style="width:22px">'+k+'</b><span style="flex:1">'+DISH[i].e+' '+DISH[i].n+(fav&&fav.includes(i)?' ⭐':'')+'</span><b>'+n+'</b><small>vendus</small></div>';

function seasonPlan(){ const mi=monthIdx(), cur=S.pw.seasonal[mi]; if(cur&&cur.swaps) return cur; const mo=(calMonth()+1)%12, mo2=calMonth();
  const mon=monSales(monthKey(dayNum())); const carte=carteDishes(); const sc=i=>mon[i]||0; const fv=favSet(); const swaps=[];

    let cands=carte.filter(i=>DISH[i].cat===cat&&!fv[i]).sort((a,b)=>sc(a)-sc(b)), exc=false; if(!cands.length&&carteCnt()[cat]>CARTE_MIN[cat]){ cands=carte.filter(i=>DISH[i].cat===cat).sort((a,b)=>sc(a)-sc(b)); exc=true; } const out=cands[0];
    const ins=libFood().filter(i=>DISH[i].cat===cat&&DISH[i].season&&(DISH[i].season.includes(mo)||DISH[i].season.includes(mo2))&&!S.menu[i].on&&!dishLocked(i));
    if(out&&ins.length&&carteCnt()[cat]>=CARTE_MIN[cat]){ const inn=ins.sort((a,b)=>(DISH[b].season.includes(mo)?1:0)-(DISH[a].season.includes(mo)?1:0)||DISH[b].pop-DISH[a].pop)[0]; swaps.push({cat,out,in:inn,on:true,exc}); } }

function phaseOf(m){
  if(S.awaitNext||m>=CLOSE) return {k:'closed',lab:'Fermé',scene:'🔒 Fermé'};
  if(firstWeekNoDinner()&&m>=1080) return {k:'closed',lab:'Fermé',scene:'🔒 Pas de service du soir (1ʳᵉ semaine)'};
  if(m>=690&&m<OPEN) return {k:'prep',lab:'Repas du personnel',scene:'🍽️ Repas du personnel · ouverture à 12h'};
  if(m<OPEN) return {k:'prep',lab:'Préparatifs',scene:m<600?'🍳 Mise en place cuisine dès 9h':m<660?'🧹 Mise en place salle dès 10h':'⏳ Ouverture à 12h'};
  if(m>=900&&m<1020) return {k:'drinks',lab:'🍹 Boissons',scene:'🍹 15h–17h : boissons seulement (cuisine fermée)'};
  if(m>=1020&&m<1110) return {k:'break',lab:'Pause',scene:'🔒 Fermé · mise en place 18h'};
  if(m>=1110&&m<1140) return {k:'break',lab:'Repas du personnel',scene:'🍽️ Repas du personnel · ouverture à 19h'};
  if(m>=1080&&m<1140) return {k:'break',lab:'Mise en place',scene:'🧹 Mise en place cuisine + salle'};
  if(m>=1140&&m<CLOSE) return {k:'dinner',lab:'Service du soir',scene:null};
  return {k:m<900?'lunch':'dinner',lab:m<900?'Service du midi':'Service du soir',scene:null};
}

/* ---------- Congés demandés (1 j – 1 sem, ≥1 sem à l’avance) ---------- */
function leaveReqAdd(sid,d0,n){
  const s=S.staff.find(x=>x.id===sid); if(!s||!hasLeave(s)) return {ok:false,msg:'Pas de congés pour cet employé.'};
  n=clamp(Math.round(+n||1),1,7); const days=[]; for(let i=0;i<n;i++) days.push(d0+i);
  if(d0<dayNum()+7) return {ok:false,msg:'Il faut demander au moins 1 semaine à l’avance.'};
  for(const d of days){ if(closedOn(d)) return {ok:false,msg:dateShort(d)+' : restaurant déjà fermé.'}; if(onLeave(s,d)) return {ok:false,msg:s.name+' est déjà en congé le '+dateShort(d)+'.'}; }
  if(leaveLeft(s,leaveBlock(d0))<n) return {ok:false,msg:s.name+' n’a plus assez de congés (reste '+leaveLeft(s,leaveBlock(d0))+').'};
  if((S.leaveReq||[]).some(r=>r.sid===sid&&r.st==='pend'&&r.days.some(d=>days.includes(d)))) return {ok:false,msg:'Demande déjà en cours sur ces dates.'};
  S.leaveReq=S.leaveReq||[]; S.leaveReq.push({id:nid(),sid,name:s.name,days:days.slice(),st:'pend',ask:dayNum()});
  note('🏖️ '+s.name+' demande '+n+' jour'+(n>1?'s':'')+' de congé ('+dateShort(days[0])+(n>1?' → '+dateShort(days[n-1]):'')+').','info');
  return {ok:true,msg:'Demande enregistrée.'};
}
function leaveReqDecide(id,ok){
  const r=(S.leaveReq||[]).find(x=>x.id===id); if(!r||r.st!=='pend') return {ok:false,msg:'Demande introuvable.'};
  const s=S.staff.find(x=>x.id===r.sid);
  if(ok){ for(const d of r.days){ if(!onLeave(s,d)){ S.cg[s.id]=S.cg[s.id]||[]; S.cg[s.id].push(d); S.cg[s.id].sort((a,b)=>a-b); } } r.st='acc';
    note('✅ Congé accepté : '+r.name+' · '+r.days.map(dateShort).join(', ')+'.','good'); return {ok:true,msg:'Congé accepté.'}; }
  r.st='ref'; if(s){ s.mor=clamp((s.mor||60)-12,0,100); note('❌ Congé refusé : '+r.name+' (moral −12).','warn'); }
  return {ok:true,msg:'Congé refusé (moral ↓).'};
}

function xLen(pl, side){ return Math.max(1, (side==='right'||side==='left') ? (pl.H-2) : (pl.W-2)); }
function xDpForM2(pl, side, m2){ return Math.max(1, Math.round(Math.max(1, m2) / xLen(pl, side))); }
/* Carré 10×10 : on vise 100 m² (quota gratuit). Si la façade est longue,
   profondeur 10 donne un « vrai » carré 10×N ; sinon on calcule la profondeur. */
function xSq10Dp(pl, side){
  const fl = Math.max(0, (typeof xFreeLeft==='function' ? xFreeLeft() : 100));
  const target = fl > 0 ? Math.min(X_FREE_M2, fl) : X_FREE_M2;
  const byM2 = xDpForM2(pl, side, target);
  /* préfère profondeur 10 si elle reste proche de 100 m² (±30 %) */
  const m10 = xM2(pl, side, 10);
  if(m10 >= target*0.7 && m10 <= target*1.4) return 10;
  return byM2;
}
function xCurDp(pl){ return UX.mode==='sq10' ? xSq10Dp(pl, UX.s) : (UX.paidDp||6); }
function xDimLabel(pl, side, dp){
  const nW = (side==='right'||side==='left') ? pl.W+dp : pl.W;
  const nH = (side==='top'||side==='bottom') ? pl.H+dp : pl.H;
  return nW+'×'+nH;
}
function xPaintPrev(cv, pl, base){
  try{
    const C=compilePlan(pl), c=cv.getContext('2d');
    const ww=pl.W*CELL+2*PAD, wh=pl.H*CELL+2*PAD;
    const sc=Math.min(cv.width/ww, cv.height/wh);
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height);
    c.fillStyle='#2b1a16'; c.fillRect(0,0,cv.width,cv.height);
    c.setTransform(sc,0,0,sc,(cv.width-ww*sc)/2,(cv.height-wh*sc)/2);
    if(typeof paintPlanFull==='function') paintPlanFull(c,C,pl,{});
    else { paintPlan(c,C,pl,{}); if(typeof edTables==='function') edTables(c,C); }
    /* surbrillance de la zone ajoutée */
    if(base && (pl.W!==base.W || pl.H!==base.H)){
      const ox = pl.W>base.W && UX.s==='left' ? pl.W-base.W : 0;
      const oy = pl.H>base.H && UX.s==='top' ? pl.H-base.H : 0;
      c.strokeStyle='rgba(255,210,60,.95)'; c.lineWidth=1.4;
      for(let y=0;y<pl.H;y++) for(let x=0;x<pl.W;x++){
        const bx=x-ox, by=y-oy;
        const outside = bx<0||by<0||bx>=base.W||by>=base.H;
        if(outside) c.strokeRect(PAD+x*CELL+1, PAD+y*CELL+1, CELL-2, CELL-2);
      }
    }
  }catch(e){ console.error(e); }
}

function v9VivAuto(){
  if(dayNum()<OPEN_DAY) return;
  if(typeof v9Total==='function'&&v9Total()){ S.staff=S.staff.filter(s=>!(s.tmp&&s.v9dep)); return; }
  if(S.trav&&dayNum()>=S.trav.start&&dayNum()<=S.trav.end){ S.staff=S.staff.filter(s=>!(s.tmp&&s.v9dep)); return; }
  v9VivFill();
  const d=dayNum();
  /* retirer les intérims « 1 jour » d'hier + vacants dont le poste est rempli */
  S.staff=S.staff.filter(s=>{
    if(!(s.tmp&&s.v9dep)) return true;
    if(s.v9vac){ const vac=v9Vacancy(s.tmpSlot||(POSTS[s.post]&&POSTS[s.post].slot)); if(vac<=0) return false; return true; }
    return s.tmpDay===d; /* absence : seulement aujourd'hui */
  });
  const created=[];
  for(const sl in SLOTS){
    let gap=v9Gap(sl,d); if(gap<=0) continue;
    const vacN=v9Vacancy(sl);
    const pool=(S.vivier[sl]||[]).slice().sort((a,b)=>(b.note||0)-(a.note||0)||bareme(b).tot-bareme(a).tot);
    const busy=new Set(S.staff.filter(s=>s.tmp&&s.v9dep&&s.tmpDay===d&&s.v9vid).map(s=>s.v9vid));
    let taken=0;
    for(const c of pool){ if(taken>=gap) break; if(busy.has(c.id)) continue;
      const asVac=taken<vacN; /* d'abord combler les postes vacants, puis les absences */
      const st=v9VivDeployOne(c,sl,asVac); if(!st) continue;
      taken++; created.push(c.name+' → '+SLOTS[sl].n+(asVac?' (vacant)':' (1 j)'));
    }
  }
  if(created.length){ S.pw.interimLog=S.pw.interimLog||[]; S.pw.interimLog.push({d,items:created}); S.pw.interimN=(S.pw.interimN||0)+created.length;
    note('🧰 Vivier : '+created.length+' intérimaire(s) en service — '+created.slice(0,3).join(' · ')+(created.length>3?'…':''),'info'); }
  try{ S.day.interim=S.staff.filter(x=>x.tmp).reduce((a,x)=>a+x.wage,0); }catch(e){}
}

function v9VivHire(id,kind){

  else { ct=null; msg=' en CDI'; }

  S.staff=S.staff.filter(s=>!(s.tmp&&s.v9dep&&s.v9vid===c.id));
  const sk={}; if(c.sub){ if(c.sub.somm>=3) sk.sommellerie=true; if(c.sub.poly>=3) sk.poly=true; if(c.sub.terr) sk.terroir=true; if(c.sub.veg) sk.vegetal=true; if(c.sub.pat) sk.patisserie=true; }
  const lvOf=v=>Math.max(0,Math.round((v-(c.skill||5))/2));
  const st=mkStaff({id:nid(),role:P.role,post:c.post,name:c.name,age:c.age,exp:c.exp,skill:c.skill,wage,mor:55+(c.att||5)*3,

    lv:c.sub?{spd:lvOf(c.sub.vit),qual:lvOf(c.sub.qua),ami:lvOf(c.sub.ami),aut:lvOf(c.sub.aut)}:newLv(),
    wish:typeof pickWish==='function'?pickWish(P.role):[],quals:c.quals,defs:c.defs,motiv:c.motiv,note:c.note});
  if(P.role==='waiter'||P.role==='bar') st.shift='B';
  S.staff.push(st);
  v9VivRemove(c.id); v9VivFill();
  try{ defaultShifts(); replanOff(); freezeToday(); }catch(e){}
  /* si un vacant tmp couvrait ce slot et que le quota perm est atteint, ils partiront au prochain deploy */
  note('✍️ '+c.name+' embauché(e)'+msg+' ('+P.n+' · '+fm(wage)+'/j).','good');

  for(const v of ['A','B']){ const ids=v95FestV(f.k,v); if(!ids.length) continue; const tot=ids.reduce((a,i)=>a+(f.pr[i]||DISH[i].ref),0), cost=ids.reduce((a,i)=>a+festCost(i),0); const lack=v95FestStock(ids,cov); const on=f.v===v;

      '<p class="muted">Menu complet ≈ <b>'+fm(tot)+'</b> · coût matière ≈ '+fm(cost)+'<br>'+(lack.length?'⚠️ Stock à prévoir pour ~'+cov+' couverts : '+lack.slice(0,5).join(', ')+' (commande automatique prévue)':'✅ Stock suffisant pour ~'+cov+' couverts')+'</p>'+(on?'':btn('Choisir la proposition '+v,'v95fv',f.id+'|'+v,null,'primary'))+'</div>'; }
  const ids=v95FestV(f.k,f.v||'A');
  h+='<div class="card"><h3>Prix et plats retenus · proposition '+(f.v||'A')+'</h3>'+ids.map(i=>{ const d=DISH[i], pr=f.pr[i]; return '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="display:flex;gap:6px;align-items:center"><span style="flex:1">'+d.e+' <b>'+d.n+'</b><br><small>🧾 '+ingList(i)+' · coût ≈ '+fm(festCost(i))+'</small></span>'+btn('−','festpr',f.id+'|'+i+'|-0.5',null,'ghost sm')+'<b>'+fm(pr)+'</b>'+btn('+','festpr',f.id+'|'+i+'|0.5',null,'ghost sm')+btn(f.sel[i]?'✔':'✖','festsel',f.id+'|'+i,null,f.sel[i]?'primary sm':'ghost sm')+'</div></div>'; }).join('')+'</div>';
  return h+'<div class="btnrow">'+btn('Valider le menu '+(f.v||'A')+' ✔','festok',f.id,null,'primary')+btn('Refuser','festno',f.id,null,'ghost')+'</div>'; }};

function v95EvPlan(e){ const C=compilePlan(S.plan); let x0=1e9,y0=1e9,x1=0,y1=0; for(const t of C.tabs){ x0=Math.min(x0,t.x); y0=Math.min(y0,t.y); x1=Math.max(x1,t.x+t.cw); y1=Math.max(y1,t.y+t.ch); } if(!C.tabs.length){ x0=y0=0; x1=S.plan.W; y1=S.plan.H; } x0=Math.max(0,x0-1); y0=Math.max(0,y0-1); x1+=1; y1+=1; const W=x1-x0, H=y1-y0; e.sel=e.sel||[]; const capSel=e.sel.reduce((a,j)=>a+(S.tabs[j]?S.tabs[j].cap:0),0);
  let h='<div class="card"><h3>🔒 Privatiser des tables · '+e.n+' convives</h3><p class="muted">Touchez les tables à réserver au groupe : elles seront bloquées pour les autres clients à partir de 1 h 30 avant l’arrivée.</p>'+
   '<div id="v95mp" style="position:relative;width:100%;max-width:'+Math.min(560,Math.round(260*W/H))+'px;margin:6px auto;aspect-ratio:'+W+'/'+H+';background:#e9d8bf;border-radius:10px;border:2px solid #8a5a3c">';
  C.tabs.forEach((t,j)=>{ const on=e.sel.includes(j); h+='<button class="btn sm '+(on?'primary':'ghost')+'" data-a="v95tab" data-p="'+e.id+'|'+j+'" aria-label="Table '+(j+1)+'" style="position:absolute;left:'+((t.x-x0)/W*100)+'%;top:'+((t.y-y0)/H*100)+'%;width:'+(t.cw/W*100-0.6)+'%;height:'+(t.ch/H*100-0.6)+'%;min-width:0;min-height:0;padding:0;margin:0;font-size:11px;line-height:1">'+(j+1)+'<br>'+t.cap+'p</button>'; });
  const nd=e.n<=15?2:3;
  h+='</div><p>'+(capSel>=e.n?'✅':'⚠️')+' <b>'+capSel+'</b> places sélectionnées pour <b>'+e.n+'</b> convives'+(capSel<e.n?' · il manque '+(e.n-capSel)+' places (complétées automatiquement le jour J si possible)':'')+'</p>'+
   '<p class="muted">👥 Service dédié : <b>'+nd+' serveurs</b> réservés au groupe ('+(e.n<=15?'jusqu’à 15 couverts':'plus de 15 couverts')+'), remplacés en salle par '+nd+' intérimaires appelés automatiquement.</p>'+
   '<div class="btnrow">'+btn('Sélection automatique','v95tabauto',e.id,null,'ghost sm')+btn('Tout désélectionner','v95tabclr',e.id,null,'ghost sm')+'</div></div>';
  return h; }
